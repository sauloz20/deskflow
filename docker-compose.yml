services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local environment}
      POSTGRES_DB: deskflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - deskflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskflow -d deskflow"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  deskflow_pg:
