name: UI validation
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm --filter @deskflow/api schema:validate
        env:
          DATABASE_URL: postgresql://deskflow:placeholder@localhost:5432/deskflow
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @deskflow/web exec playwright install --with-deps chromium
      - run: pnpm --filter @deskflow/web test:e2e
